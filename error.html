<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found | Wanderly</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="error.css">
</head>

<body>

    <main class="error-page">

        <div class="error-background"></div>

        <div class="error-overlay"></div>

        <div class="floating-shape shape-one"></div>
        <div class="floating-shape shape-two"></div>
        <div class="floating-shape shape-three"></div>

        <div class="container">

            <div class="error-content">

                <a href="index.html" class="error-logo">
                    <img src="Assets/blacklogo.webp" alt="Wanderly Logo">
                </a>

                <div class="error-illustration">

                    <div class="error-number">
                        <span>4</span>

                        <div class="error-globe">
                            <i class="fa-solid fa-earth-americas"></i>
                        </div>

                        <span>4</span>
                    </div>

                    <div class="error-plane">
                        <i class="fa-solid fa-plane"></i>
                    </div>

                </div>

                <div class="error-text">

                    <span class="error-label">
                        <i class="fa-solid fa-compass"></i>
                        OOPS! WRONG DESTINATION
                    </span>

                    <h1>Looks Like You're <span>Lost!</span></h1>

                    <p>
                        The page you're looking for seems to have taken
                        a different route. Don't worry, your next adventure
                        is just one click away.
                    </p>

                </div>

                <div class="error-actions">

                    <button type="button" class="back-btn" id="goBack">
                        <i class="fa-solid fa-arrow-left"></i>
                        Go Back
                    </button>

                    <a href="index.html" class="home-btn">
                        <i class="fa-solid fa-house"></i>
                        Back to Home
                    </a>

                </div>

                <div class="error-footer">

                    <span>
                        <i class="fa-solid fa-globe"></i>
                        Wanderly Travel
                    </span>

                    <span class="footer-divider"></span>

                    <span>Every journey begins somewhere.</span>

                </div>

            </div>

        </div>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.14.2/gsap.min.js"></script>

    <script src="error.js"></script>

</body>
</html>
